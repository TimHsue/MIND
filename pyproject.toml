[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mind-generative"
version = "0.7.0rc1"
description = "MIND holoplane generation, geometry decoding and training"
readme = "README.md"
license = {text = "CC-BY-NC-SA-4.0"}
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.4,<2.6", "numpy>=1.26,<3", "scipy>=1.12",
  "scikit-image>=0.23", "matplotlib>=3.8", "pillow", "tensorboardX>=2.6",
  "tqdm", "click>=8", "psutil", "requests",
]

[project.optional-dependencies]
physics = ["pyamg==5.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mind_holoplane = ['native/*.npz']

[tool.setuptools]
license-files = ["LICENSE.txt"]
